name: Verify and deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'   # daily: pick up new Flickr albums
    - cron: '17 2,5 * * 1'  # Sunday evening (US Pacific): pick up the new sermon
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build album list from gallery/albums folders
        run: python3 tools/make_manifest.py
      - name: Add public Flickr albums (skipped if no key)
        env: { FLICKR_KEY: '${{ secrets.FLICKR_KEY }}' }
        run: python3 tools/fetch_flickr.py
      - name: Latest sermon videos from YouTube (skipped on any problem)
        run: python3 tools/fetch_youtube.py
      - run: python3 tools/verify_site.py
      - name: Build publish folder (site files only)
        run: mkdir _site && cp -r *.html *.css *.js *.json CNAME img gallery _site/
      - name: Version CSS/JS links so browsers never use stale copies
        run: sed -i "s/href=\"style.css\"/href=\"style.css?v=${GITHUB_SHA::8}\"/; s/src=\"site.js\"/src=\"site.js?v=${GITHUB_SHA::8}\"/" _site/*.html
      - name: Publish the version number (lets open pages notice a newer version)
        run: echo "{\"v\":\"${GITHUB_SHA::8}\"}" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
