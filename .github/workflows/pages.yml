name: Verify and deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'   # daily: pick up new Flickr albums
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build album list from gallery/albums folders
        run: python3 tools/make_manifest.py
      - name: Add public Flickr albums (skipped if no key)
        env: { FLICKR_KEY: '${{ secrets.FLICKR_KEY }}' }
        run: python3 tools/fetch_flickr.py
      - run: python3 tools/verify_site.py
      - name: Build publish folder (site files only)
        run: mkdir _site && cp -r *.html *.css *.js *.json CNAME img gallery _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
